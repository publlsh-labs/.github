<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img"><title>Colour palette</title><rect width="1200" height="640" rx="0" fill="#FFFFFF"/><text x="60" y="80" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:34px;font-weight:700" fill="#171717" fill-opacity="1" text-anchor="start">Colour palette</text><text x="60" y="112" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:400" fill="#171717" fill-opacity="0.6" text-anchor="start">CMYK values are approximate. Always proof against a physical swatch.</text><rect x="60" y="150" width="204" height="190" rx="12" fill="#171717" stroke="#D9D9D4" stroke-width="1"/><text x="80" y="300" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700" fill="#FFFFFF" fill-opacity="1" text-anchor="start">Charcoal</text><text x="80" y="324" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:400" fill="#FFFFFF" fill-opacity="0.85" text-anchor="start">#171717</text><text x="60" y="375" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">RGB 23, 23, 23</text><text x="60" y="396" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">CMYK 0, 0, 0, 91</text><text x="60" y="424" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400" fill="#171717" fill-opacity="0.6" text-anchor="start">Primary. Symbol, wordmark, text</text><rect x="284" y="150" width="204" height="190" rx="12" fill="#FE7909" stroke="#D9D9D4" stroke-width="1"/><text x="304" y="300" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700" fill="#171717" fill-opacity="1" text-anchor="start">Beak orange</text><text x="304" y="324" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:400" fill="#171717" fill-opacity="0.85" text-anchor="start">#FE7909</text><text x="284" y="375" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">RGB 254, 121, 9</text><text x="284" y="396" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">CMYK 0, 52, 96, 0</text><text x="284" y="424" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400" fill="#171717" fill-opacity="0.6" text-anchor="start">Accent. The beak only, CTAs</text><rect x="508" y="150" width="204" height="190" rx="12" fill="#FFFFFF" stroke="#D9D9D4" stroke-width="1"/><text x="528" y="300" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700" fill="#171717" fill-opacity="1" text-anchor="start">White</text><text x="528" y="324" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:400" fill="#171717" fill-opacity="0.85" text-anchor="start">#FFFFFF</text><text x="508" y="375" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">RGB 255, 255, 255</text><text x="508" y="396" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">CMYK 0, 0, 0, 0</text><text x="508" y="424" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400" fill="#171717" fill-opacity="0.6" text-anchor="start">Backgrounds, reversed logo</text><rect x="732" y="150" width="204" height="190" rx="12" fill="#F4F4F2" stroke="#D9D9D4" stroke-width="1"/><text x="752" y="300" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700" fill="#171717" fill-opacity="1" text-anchor="start">Mist</text><text x="752" y="324" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:400" fill="#171717" fill-opacity="0.85" text-anchor="start">#F4F4F2</text><text x="732" y="375" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">RGB 244, 244, 242</text><text x="732" y="396" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">CMYK 1, 1, 2, 0</text><text x="732" y="424" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400" fill="#171717" fill-opacity="0.6" text-anchor="start">Supporting surface</text><rect x="956" y="150" width="204" height="190" rx="12" fill="#6B6B66" stroke="#D9D9D4" stroke-width="1"/><text x="976" y="300" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700" fill="#FFFFFF" fill-opacity="1" text-anchor="start">Slate</text><text x="976" y="324" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:400" fill="#FFFFFF" fill-opacity="0.85" text-anchor="start">#6B6B66</text><text x="956" y="375" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">RGB 107, 107, 102</text><text x="956" y="396" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="1" text-anchor="start">CMYK 0, 0, 1, 58</text><text x="956" y="424" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:400" fill="#171717" fill-opacity="0.6" text-anchor="start">Supporting text, borders</text><text x="60" y="500" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700" fill="#171717" fill-opacity="1" text-anchor="start">Usage ratio</text><rect x="60" y="520" width="680" height="40" fill="#FFFFFF" stroke="#D9D9D4"/><rect x="60" y="520" width="374" height="40" fill="#171717"/><rect x="434" y="520" width="34" height="40" fill="#FE7909"/><rect x="468" y="520" width="272" height="40" fill="#F4F4F2"/><text x="60" y="588" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400" fill="#171717" fill-opacity="0.7" text-anchor="start">Charcoal 55%  ·  Orange 5%  ·  Neutrals 40%. Orange is a small, deliberate accent.</text></svg>
